[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "b3hatd"
dynamic = ["version"]
description = "B3 (BuildBrickBlocks) Build HAT daemon"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=7.2", "pytest-asyncio>=0.20"]

[tool.setuptools]
packages = ["b3hatd"]

[tool.setuptools.dynamic]
version = { attr = "b3hatd.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["hardware: needs a real Build HAT (run on the Pi with -m hardware)"]
addopts = "-m 'not hardware'"
